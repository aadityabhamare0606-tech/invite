<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vivaan &amp; Anaya — Save the Date</title>
<meta name="description" content="Light the diya to reveal the date. Vivaan &amp; Anaya are getting married."/>
<style>
/* ════════════════════════════════════════════════════════
   DIYA NIGHT  —  Save the Date
   Palette: deep indigo night, terracotta, marigold amber, cream
   The whole page lives in darkness until the diya is lit.
   Three taps reveal Day · Month · Year one by one.
   On full reveal: wax drips, smoke rises, sparks scatter,
   marigold petals rain down, the room glows warm.
════════════════════════════════════════════════════════ */

:root {
  --night:        #080612;
  --night-mid:    #0f0c24;
  --indigo:       #1a1540;
  --terracotta:   #c4622d;
  --terra-deep:   #8b3a14;
  --amber:        #f0a500;
  --amber-pale:   #f5c518;
  --marigold:     #f4820a;
  --flame-core:   #fff7c0;
  --flame-mid:    #ffb830;
  --flame-outer:  #ff6010;
  --cream:        #fef6e8;
  --cream-dim:    rgba(254,246,232,0.82);
  --gold:         #c9a84c;
  --gold-pale:    #e8d090;
  --smoke:        rgba(200,190,180,0.55);
  --glow-warm:    rgba(240,165,0,0.18);
  --glow-full:    rgba(240,165,0,0.42);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%; width: 100%;
  overflow-x: hidden;
  background: var(--night);
  color: var(--cream);
  -webkit-font-smoothing: antialiased;
}

/* ── Fonts ── */
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600&family=Cormorant+Infant:ital,wght@0,400;1,400&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap');

/* ════════════════════════════════════════════════════════
   SCENE  —  full-viewport with layered depth
════════════════════════════════════════════════════════ */
#scene {
  position: relative;
  width: 100%;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow: hidden;
  background: radial-gradient(ellipse 100% 120% at 50% 100%, #1a0e08 0%, #0f0c24 40%, #080612 100%);
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ── Starfield ── */
#stars {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(circle, rgba(255,255,255,0.7) 1px, transparent 1px),
    radial-gradient(circle, rgba(255,255,255,0.4) 1px, transparent 1px),
    radial-gradient(circle, rgba(255,240,180,0.5) 1px, transparent 1px);
  background-size: 200px 200px, 300px 300px, 150px 150px;
  background-position: 0 0, 80px 60px, 40px 110px;
  animation: star-drift 60s linear infinite;
  opacity: 0.65;
  transition: opacity 2s ease;
}
#scene.lit #stars { opacity: 0.15; }
@keyframes star-drift {
  from { background-position: 0 0, 80px 60px, 40px 110px; }
  to   { background-position: 200px 200px, 380px 260px, 190px 260px; }
}

/* ── Room warm glow — spreads on light ── */
#room-glow {
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse 90% 70% at 50% 78%,
    rgba(240,130,10,0) 0%, transparent 100%);
  transition: background 2.4s cubic-bezier(.4,0,.2,1);
}
#scene.lit-1 #room-glow {
  background: radial-gradient(ellipse 80% 60% at 50% 78%,
    rgba(240,130,10,0.18) 0%, rgba(200,90,10,0.08) 55%, transparent 100%);
}
#scene.lit-2 #room-glow {
  background: radial-gradient(ellipse 100% 75% at 50% 78%,
    rgba(240,150,10,0.32) 0%, rgba(200,90,10,0.16) 55%, transparent 100%);
}
#scene.lit-3 #room-glow {
  background: radial-gradient(ellipse 130% 90% at 50% 78%,
    rgba(240,165,0,0.52) 0%, rgba(200,100,10,0.28) 52%, rgba(140,60,10,0.12) 76%, transparent 100%);
}

/* ── Floor line ── */
#floor {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 38%; pointer-events: none; z-index: 2;
  background: linear-gradient(to top, rgba(28,12,4,0.95) 0%, rgba(20,10,6,0.6) 50%, transparent 100%);
}

/* ── Rangoli ring around diya ── */
#rangoli {
  position: absolute;
  width: min(380px, 88vw); height: min(380px, 88vw);
  bottom: calc(22% - min(190px, 44vw));
  left: 50%; transform: translateX(-50%);
  z-index: 3; pointer-events: none;
  opacity: 0;
  transition: opacity 1.8s ease 0.4s;
}
#scene.lit-1 #rangoli { opacity: 1; }
#rangoli svg { width: 100%; height: 100%; }

/* ── Diya SVG container ── */
#diya-wrap {
  position: absolute;
  bottom: 22%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  width: min(180px, 46vw);
  filter: drop-shadow(0 0 0px rgba(240,165,0,0));
  transition: filter 1.5s ease, transform 0.18s ease;
}
#diya-wrap:active { transform: translateX(-50%) scale(0.96); }
#scene.lit-1 #diya-wrap { filter: drop-shadow(0 0 24px rgba(240,130,10,0.6)); }
#scene.lit-2 #diya-wrap { filter: drop-shadow(0 0 38px rgba(240,150,10,0.75)); }
#scene.lit-3 #diya-wrap { filter: drop-shadow(0 0 55px rgba(240,165,0,0.9)); }

/* ── Flame canvas ── */
#flame-canvas {
  position: absolute;
  bottom: 100%; left: 50%;
  transform: translateX(-50%);
  pointer-events: none; z-index: 20;
  opacity: 0;
  transition: opacity 0.8s ease;
}
#scene.lit-1 #flame-canvas { opacity: 1; }

/* ── Smoke canvas ── */
#smoke-canvas {
  position: absolute;
  bottom: 65%; left: 50%;
  transform: translateX(-50%);
  pointer-events: none; z-index: 5;
  opacity: 0;
  transition: opacity 1s ease 0.5s;
}
#scene.lit-3 #smoke-canvas { opacity: 1; }

/* ── Petals canvas ── */
#petals-canvas {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 25;
}

/* ── Date reveal strips ── */
#date-reveal {
  position: absolute;
  bottom: 52%;
  left: 50%; transform: translateX(-50%);
  z-index: 30; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  width: min(440px, 92vw); text-align: center;
}

/* Each date part rises out of darkness */
.date-part {
  opacity: 0;
  transform: translateY(28px) scale(0.92);
  transition: opacity 1.1s cubic-bezier(.22,1,.36,1), transform 1.1s cubic-bezier(.22,1,.36,1);
}
.date-part.revealed { opacity: 1; transform: translateY(0) scale(1); }

.date-numeral {
  font-family: 'Cormorant Infant', serif;
  font-size: clamp(5.5rem, 18vw, 10rem);
  line-height: 0.9;
  color: var(--cream);
  letter-spacing: -0.02em;
  text-shadow:
    0 0 60px rgba(240,165,0,0.8),
    0 0 120px rgba(240,130,10,0.5),
    0 4px 24px rgba(0,0,0,0.7);
}
.date-month {
  font-family: 'Cormorant Upright', serif;
  font-size: clamp(1.8rem, 6vw, 3.4rem);
  font-weight: 300;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--amber-pale);
  text-shadow: 0 0 30px rgba(240,165,0,0.6), 0 2px 12px rgba(0,0,0,0.5);
}
.date-year {
  font-family: 'Cormorant Upright', serif;
  font-size: clamp(1rem, 3.5vw, 1.6rem);
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: rgba(254,246,232,0.7);
  text-shadow: 0 0 20px rgba(240,165,0,0.4);
}
.date-rule {
  width: 0; height: 1px; margin: 6px auto;
  background: linear-gradient(to right, transparent, rgba(240,165,0,0.7), transparent);
  transition: width 1.2s cubic-bezier(.22,1,.36,1) 0.3s;
}
.date-rule.revealed { width: min(200px, 55vw); }

/* ── Names ── */
#names {
  position: absolute;
  top: clamp(28px, 6vh, 52px);
  left: 50%; transform: translateX(-50%);
  z-index: 30; pointer-events: none; text-align: center;
  opacity: 0; transition: opacity 1.4s ease;
  white-space: nowrap;
}
#scene.lit-3 #names { opacity: 1; }

.names-kicker {
  font-family: 'Cormorant Upright', serif;
  font-size: clamp(9px, 1.2vw, 11px);
  letter-spacing: 0.44em; text-transform: uppercase;
  color: rgba(240,165,0,0.65);
  margin-bottom: 8px;
}
.names-main {
  font-family: 'Cormorant Infant', serif;
  font-size: clamp(2rem, 6vw, 3.8rem);
  font-weight: 400; line-height: 1.05;
  color: var(--cream);
  text-shadow: 0 2px 20px rgba(0,0,0,0.5), 0 0 50px rgba(240,165,0,0.3);
}
.names-ampersand {
  font-family: 'Cormorant Infant', serif;
  font-style: italic;
  color: rgba(240,165,0,0.75);
  font-size: 0.7em;
  margin: 0 0.15em;
}

/* ── Blessing ── */
#blessing {
  position: absolute;
  top: clamp(28px, 6vh, 52px);
  left: 50%; transform: translateX(-50%);
  z-index: 30; pointer-events: none; text-align: center;
  opacity: 1; transition: opacity 0.8s ease;
}
#scene.lit-1 #blessing { opacity: 0; }
.blessing-text {
  font-family: 'Tiro Devanagari Hindi', serif;
  font-size: clamp(0.95rem, 2.8vw, 1.35rem);
  color: rgba(254,246,232,0.5);
  letter-spacing: 0.08em;
}

/* ── Tap hint ── */
#tap-hint {
  position: absolute; bottom: 8%; left: 50%;
  transform: translateX(-50%);
  z-index: 30; pointer-events: none; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  animation: hint-breathe 2.6s ease-in-out infinite;
  transition: opacity 0.8s ease;
}
#scene.lit-3 #tap-hint { opacity: 0; }
.hint-text {
  font-family: 'Cormorant Upright', serif;
  font-size: clamp(1.1rem, 3vw, 1.4rem);
  color: rgba(240,165,0,0.7);
  letter-spacing: 0.08em;
}
.hint-arrow {
  width: 1px; height: 28px;
  background: linear-gradient(to bottom, rgba(240,165,0,0.7), transparent);
  animation: hint-drop 2.6s ease-in-out infinite;
}
@keyframes hint-breathe {
  0%,100% { opacity: 0.7; } 50% { opacity: 1; }
}
@keyframes hint-drop {
  0%,100% { transform: scaleY(1) translateY(0); opacity: 0.7; }
  50%     { transform: scaleY(1.3) translateY(4px); opacity: 1; }
}

/* ── Progress dots ── */
#progress {
  position: absolute; bottom: 15%; left: 50%;
  transform: translateX(-50%);
  z-index: 30; pointer-events: none;
  display: flex; gap: 10px; align-items: center;
}
.prog-dot {
  width: 6px; height: 6px; border-radius: 9999px;
  background: rgba(240,165,0,0.25);
  transition: all 0.5s cubic-bezier(.22,1,.36,1);
}
.prog-dot.done {
  background: rgba(240,165,0,0.9);
  box-shadow: 0 0 10px rgba(240,165,0,0.6);
  transform: scale(1.25);
}
.prog-dot.active {
  background: rgba(240,165,0,0.6);
  box-shadow: 0 0 8px rgba(240,165,0,0.4);
  animation: dot-pulse 2s ease-in-out infinite;
}
@keyframes dot-pulse {
  0%,100% { box-shadow: 0 0 6px rgba(240,165,0,0.4); }
  50%     { box-shadow: 0 0 14px rgba(240,165,0,0.8); }
}

/* ── Finale — full date line ── */
#finale {
  position: absolute;
  bottom: 54%; left: 50%; transform: translateX(-50%);
  z-index: 35; pointer-events: none; text-align: center;
  opacity: 0; transition: opacity 1s ease 0.4s;
  white-space: nowrap;
}
#scene.lit-3 #finale { opacity: 1; }
.finale-line {
  font-family: 'Cormorant Upright', serif;
  font-size: clamp(0.65rem, 1.6vw, 0.85rem);
  letter-spacing: 0.5em; text-transform: uppercase;
  color: rgba(240,165,0,0.55);
}

/* ── Wax drip ── */
.wax-drip {
  position: absolute; pointer-events: none; z-index: 9;
  border-radius: 0 0 50% 50%;
  opacity: 0;
  animation: drip-fall 1.6s cubic-bezier(.22,1,.36,1) forwards;
  background: radial-gradient(ellipse at top, rgba(240,130,10,0.85), rgba(180,80,10,0.65));
}
@keyframes drip-fall {
  0%   { opacity: 0; height: 0; }
  20%  { opacity: 1; }
  100% { opacity: 0.6; }
}

/* ── Corner ornaments ── */
.corner {
  position: absolute; pointer-events: none; z-index: 4;
  opacity: 0; transition: opacity 1.5s ease;
}
#scene.lit-1 .corner { opacity: 1; }
.corner svg { display: block; }
.corner-tl { top: 18px; left: 18px; }
.corner-tr { top: 18px; right: 18px; transform: scaleX(-1); }
.corner-bl { bottom: 18px; left: 18px; transform: scaleY(-1); }
.corner-br { bottom: 18px; right: 18px; transform: scale(-1); }

/* ── Marigold garland ── */
#garland {
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  z-index: 4; pointer-events: none;
  opacity: 0; transition: opacity 1.2s ease 0.6s;
  width: min(500px, 95vw);
}
#scene.lit-2 #garland { opacity: 1; }

/* ── Wax pool under diya ── */
#wax-pool {
  position: absolute; z-index: 7; pointer-events: none;
  bottom: 23.5%; left: 50%; transform: translateX(-50%);
  width: min(40px, 10vw); height: min(8px, 2vw);
  border-radius: 50%;
  background: rgba(230,140,20,0.0);
  transition: background 1.5s ease, width 1.5s ease;
}
#scene.lit-2 #wax-pool {
  background: radial-gradient(ellipse, rgba(230,140,20,0.5) 0%, transparent 70%);
  width: min(56px, 14vw);
}
#scene.lit-3 #wax-pool {
  background: radial-gradient(ellipse, rgba(230,140,20,0.75) 0%, transparent 70%);
  width: min(70px, 18vw);
}

/* ── Responsive adjustments ── */
@media (max-height: 640px) {
  #diya-wrap { width: min(140px, 38vw); }
  .date-numeral { font-size: clamp(4rem, 14vw, 7rem); }
}
</style>
</head>

<div id="scene">

  <!-- Stars -->
  <div id="stars"></div>

  <!-- Room warm glow -->
  <div id="room-glow"></div>

  <!-- Corner ornaments -->
  <div class="corner corner-tl">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
      <path d="M4 26 L4 4 L26 4" stroke="rgba(240,165,0,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="4" cy="4" r="2.5" fill="rgba(240,165,0,0.5)"/>
      <path d="M4 14 Q14 4 26 4" stroke="rgba(240,165,0,0.18)" stroke-width="0.8" fill="none" stroke-dasharray="2 4"/>
    </svg>
  </div>
  <div class="corner corner-tr">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
      <path d="M4 26 L4 4 L26 4" stroke="rgba(240,165,0,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="4" cy="4" r="2.5" fill="rgba(240,165,0,0.5)"/>
      <path d="M4 14 Q14 4 26 4" stroke="rgba(240,165,0,0.18)" stroke-width="0.8" fill="none" stroke-dasharray="2 4"/>
    </svg>
  </div>
  <div class="corner corner-bl">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
      <path d="M4 26 L4 4 L26 4" stroke="rgba(240,165,0,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="4" cy="4" r="2.5" fill="rgba(240,165,0,0.5)"/>
    </svg>
  </div>
  <div class="corner corner-br">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
      <path d="M4 26 L4 4 L26 4" stroke="rgba(240,165,0,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="4" cy="4" r="2.5" fill="rgba(240,165,0,0.5)"/>
    </svg>
  </div>

  <!-- Sanskrit blessing — disappears after first tap -->
  <div id="blessing">
    <p class="blessing-text">॥ शुभ विवाह ॥</p>

  <!-- Names — appear after lit-3 -->
  <div id="names">
    <p class="names-kicker">Save the Date</p>
    <p class="names-main">Vivaan<span class="names-ampersand">&amp;</span>Anaya</p>
  </div>

  <!-- Garland SVG -->
  <div id="garland">
    <svg viewBox="0 0 500 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="mg1" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f5c518" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#f4820a" stop-opacity="0.6"/>
        </radialGradient>
        <radialGradient id="mg2" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#e85d10" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#c4622d" stop-opacity="0.5"/>
        </radialGradient>
      </defs>
      <!-- String -->
      <path d="M 0 20 Q 125 45 250 20 Q 375 -5 500 20" stroke="rgba(200,160,60,0.45)" stroke-width="1.2" fill="none"/>
      <!-- Marigold flowers along string -->
      <g>
        <!-- Flower = layered ellipses (petals + centre) -->
        <g transform="translate(30,28)">
          <ellipse rx="8" ry="5" fill="url(#mg1)" opacity="0.85"/>
          <ellipse rx="5" ry="8" fill="url(#mg1)" opacity="0.7"/>
          <circle r="3.5" fill="#fff3a0" opacity="0.9"/>
        </g>
        <g transform="translate(80,38)">
          <ellipse rx="9" ry="5.5" fill="url(#mg2)" opacity="0.8"/>
          <ellipse rx="5.5" ry="9" fill="url(#mg2)" opacity="0.65"/>
          <circle r="4" fill="#ffdf60" opacity="0.9"/>
        </g>
        <g transform="translate(130,26)">
          <ellipse rx="8" ry="5" fill="url(#mg1)" opacity="0.85"/>
          <ellipse rx="5" ry="8" fill="url(#mg1)" opacity="0.7"/>
          <circle r="3.5" fill="#fff3a0" opacity="0.9"/>
        </g>
        <g transform="translate(180,35)">
          <ellipse rx="9" ry="5.5" fill="url(#mg2)" opacity="0.8"/>

        <g transform="translate(250,20)">
          <ellipse rx="10" ry="6" fill="url(#mg1)" opacity="0.9"/>

        <g transform="translate(320,33)">
          <ellipse rx="9" ry="5.5" fill="url(#mg2)" opacity="0.8"/>

          <ellipse rx="8" ry="5" fill="url(#mg1)" opacity="0.85"/>

        </g>
      </g>
    </svg>
  </div>

  <!-- Rangoli -->
  <div id="rangoli">
    <svg viewBox="0 0 380 380" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="rg" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(240,165,0,0.22)"/>
          <stop offset="100%" stop-color="rgba(240,165,0,0)"/>

      </defs>
      <circle cx="190" cy="190" r="185" fill="url(#rg)"/>

      <circle cx="190" cy="190" r="148" stroke="rgba(240,165,0,0.18)" stroke-width="1"/>
      <!-- 8 petals -->
      <g stroke="rgba(240,140,10,0.35)" stroke-width="1.2" fill="none">
        <ellipse cx="190" cy="84" rx="14" ry="38" transform="rotate(0 190 190)"/>

      </g>
      <!-- Inner ring of dots -->
      <g fill="rgba(240,165,0,0.5)">
        <circle cx="190" cy="118" r="3"/>
        <circle cx="245" cy="135" r="2.5" transform="rotate(45 190 190)"/>
        <circle cx="262" cy="190" r="3" transform="rotate(90 190 190)"/>
        <circle cx="245" cy="245" r="2.5" transform="rotate(135 190 190)"/>
        <circle cx="190" cy="262" r="3" transform="rotate(180 190 190)"/>
        <circle cx="135" cy="245" r="2.5" transform="rotate(225 190 190)"/>
        <circle cx="118" cy="190" r="3" transform="rotate(270 190 190)"/>
        <circle cx="135" cy="135" r="2.5" transform="rotate(315 190 190)"/>
      </g>
      <!-- Centre circles -->
      <circle cx="190" cy="190" r="48" stroke="rgba(240,165,0,0.3)" stroke-width="1.5"/>
      <circle cx="190" cy="190" r="28" stroke="rgba(240,165,0,0.25)" stroke-width="1"/>
      <circle cx="190" cy="190" r="10" fill="rgba(240,165,0,0.28)"/>
    </svg>
  </div>

  <!-- Diya SVG -->
  <div id="diya-wrap">
    <svg id="diya-svg" viewBox="0 0 180 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Oil base in bowl -->
      <ellipse cx="90" cy="85" rx="48" ry="12" fill="rgba(180,90,10,0.55)"/>
      <!-- Diya bowl — terracotta -->
      <path d="M 34 80 Q 30 105, 90 108 Q 150 105, 146 80 Q 130 72, 90 70 Q 50 72, 34 80 Z" fill="#c4622d"/>
      <!-- Inner bowl shading -->
      <path d="M 44 80 Q 42 100, 90 103 Q 138 100, 136 80 Q 122 74, 90 73 Q 58 74, 44 80 Z" fill="#a04e22"/>
      <!-- Rim highlight -->
      <path d="M 34 80 Q 90 68, 146 80" stroke="rgba(255,220,160,0.35)" stroke-width="1.5" fill="none"/>
      <!-- Wick holder nozzle -->
      <path d="M 82 72 Q 78 62, 70 56 Q 66 52, 68 50 Q 72 48, 78 54 Q 84 62, 86 72 Z" fill="#8b3a14"/>
      <!-- Wick -->
      <path d="M 74 54 Q 72 50, 75 46 Q 77 43, 79 46 Q 81 50, 79 54" fill="#3d2010" stroke="rgba(60,30,10,0.5)" stroke-width="0.5"/>
      <!-- Oil surface shine -->
      <ellipse cx="90" cy="84" rx="30" ry="6" fill="rgba(240,165,0,0.15)"/>
      <ellipse cx="80" cy="82" rx="12" ry="3" fill="rgba(255,240,180,0.12)"/>
      <!-- Base plate -->
      <ellipse cx="90" cy="108" rx="52" ry="8" fill="#8b3a14"/>
      <ellipse cx="90" cy="106" rx="52" ry="6" fill="#a04e22"/>
    </svg>

    <!-- Flame canvas sits above diya via CSS -->
    <canvas id="flame-canvas" width="90" height="130"></canvas>
  </div>

  <!-- Wax pool -->
  <div id="wax-pool"></div>

  <!-- Smoke canvas -->
  <canvas id="smoke-canvas" width="120" height="160"></canvas>

  <!-- Petals/sparks canvas -->
  <canvas id="petals-canvas"></canvas>

  <!-- Date reveal -->
  <div id="date-reveal">
    <div class="date-part" id="part-day">
      <div class="date-numeral" id="day-num">21</div>
    </div>
    <div class="date-rule" id="rule-1"></div>
    <div class="date-part" id="part-month">
      <div class="date-month" id="month-name">November</div>
    </div>
    <div class="date-rule" id="rule-2"></div>
    <div class="date-part" id="part-year">
      <div class="date-year" id="year-num">2027</div>
    </div>
  </div>

  <!-- Finale tagline -->
  <div id="finale">
    <p class="finale-line">Udaipur &nbsp;·&nbsp; Rajasthan &nbsp;·&nbsp; India</p>
  </div>

  <!-- Tap hint -->
  <div id="tap-hint">
    <p class="hint-text">Tap the diya to light it</p>
    <div class="hint-arrow"></div>
  </div>

  <!-- Progress dots -->
  <div id="progress">
    <div class="prog-dot active" id="dot-0"></div>
    <div class="prog-dot" id="dot-1"></div>
    <div class="prog-dot" id="dot-2"></div>
  </div>

  <!-- Floor -->
  <div id="floor"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════
   DIYA NIGHT — interaction engine
   Three taps: each reveals one part of the date.
   Flame runs on canvas with physics-based turbulence.
   Smoke rises after full reveal. Petals/sparks burst.
════════════════════════════════════════════════════════ */

const scene       = document.getElementById('scene');
const flameCanvas = document.getElementById('flame-canvas');
const fCtx        = flameCanvas.getContext('2d');
const smokeCanvas = document.getElementById('smoke-canvas');
const sCtx        = smokeCanvas.getContext('2d');
const petalsCanvas = document.getElementById('petals-canvas');
const pCtx        = petalsCanvas.getContext('2d');

let tapCount = 0;
let flameRaf = 0;
let smokeRaf = 0;
let flameIntensity = 0;   // 0→1, drives flame size + glow
let flameT = 0;           // time counter for turbulence
let reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ── Resize petals canvas ── */
function resizePetals() {
  petalsCanvas.width  = window.innerWidth;
  petalsCanvas.height = window.innerHeight;
}
resizePetals();
window.addEventListener('resize', resizePetals, { passive: true });

/* ════════════ FLAME ════════════ */
const FLAME_W = 90, FLAME_H = 130;

function drawFlame() {
  fCtx.clearRect(0, 0, FLAME_W, FLAME_H);

  const cx = FLAME_W / 2;
  const baseY = FLAME_H - 8;

  // Turbulence
  flameT += 0.055;
  const sway   = Math.sin(flameT * 1.3) * 4 * flameIntensity;
  const sway2  = Math.sin(flameT * 2.1 + 1) * 2.5 * flameIntensity;
  const flicker = 0.88 + Math.sin(flameT * 4.7) * 0.10 + Math.sin(flameT * 7.3) * 0.04;

  const h = (FLAME_H - 28) * flameIntensity * flicker;

  if (h < 4) { flameRaf = requestAnimationFrame(drawFlame); return; }

  // Outer glow (bloom)
  const glow = fCtx.createRadialGradient(cx + sway, baseY - h * 0.55, h * 0.05,
                                          cx + sway, baseY - h * 0.45, h * 0.85);
  glow.addColorStop(0, `rgba(255,180,40,${0.22 * flameIntensity})`);
  glow.addColorStop(0.5, `rgba(255,120,10,${0.12 * flameIntensity})`);
  glow.addColorStop(1, 'rgba(255,80,0,0)');
  fCtx.fillStyle = glow;
  fCtx.beginPath();
  fCtx.ellipse(cx + sway, baseY - h * 0.45, h * 0.7, h * 0.85, 0, 0, Math.PI * 2);
  fCtx.fill();

  // Outer flame — hot orange
  const grad1 = fCtx.createRadialGradient(cx + sway, baseY - h * 0.35, 0,
                                            cx + sway, baseY - h * 0.6, h * 0.55);
  grad1.addColorStop(0,   `rgba(255,230,100,${0.85 * flameIntensity})`);
  grad1.addColorStop(0.3, `rgba(255,140,20,${0.82 * flameIntensity})`);
  grad1.addColorStop(0.7, `rgba(240,70,5,${0.6 * flameIntensity})`);
  grad1.addColorStop(1,   'rgba(200,40,0,0)');

  fCtx.fillStyle = grad1;
  fCtx.beginPath();
  fCtx.moveTo(cx + sway, baseY - h);
  fCtx.bezierCurveTo(
    cx + sway + 14, baseY - h * 0.6,
    cx + sway2 + 16, baseY - h * 0.2,
    cx, baseY
  );
  fCtx.bezierCurveTo(
    cx - 16 + sway2, baseY - h * 0.2,
    cx + sway - 14, baseY - h * 0.6,
    cx + sway, baseY - h
  );
  fCtx.fill();

  // Inner flame — bright yellow-white core
  const innerH = h * 0.6;
  const grad2 = fCtx.createRadialGradient(
    cx + sway * 0.5, baseY - innerH * 0.5, 0,
    cx + sway * 0.5, baseY - innerH * 0.7, innerH * 0.4
  );
  grad2.addColorStop(0,   `rgba(255,255,220,${0.98 * flameIntensity})`);
  grad2.addColorStop(0.35, `rgba(255,240,120,${0.85 * flameIntensity})`);
  grad2.addColorStop(0.7, `rgba(255,180,40,${0.55 * flameIntensity})`);
  grad2.addColorStop(1,   'rgba(255,100,0,0)');

  fCtx.fillStyle = grad2;
  fCtx.beginPath();
  fCtx.moveTo(cx + sway * 0.5, baseY - innerH);
  fCtx.bezierCurveTo(
    cx + sway * 0.5 + 7,  baseY - innerH * 0.55,
    cx + sway2 * 0.5 + 8, baseY - innerH * 0.2,
    cx, baseY - 4
  );
  fCtx.bezierCurveTo(
    cx - 8 + sway2 * 0.5, baseY - innerH * 0.2,
    cx + sway * 0.5 - 7,  baseY - innerH * 0.55,
    cx + sway * 0.5, baseY - innerH
  );
  fCtx.fill();

  // Tiny bright spark tip
  if (flameIntensity > 0.5) {
    fCtx.beginPath();
    fCtx.arc(cx + sway, baseY - h, 2.5, 0, Math.PI * 2);
    fCtx.fillStyle = `rgba(255,255,240,${0.9 * flameIntensity})`;
    fCtx.fill();
  }

  flameRaf = requestAnimationFrame(drawFlame);
}

/* Gradually intensify flame when lit */
function igniteFlame() {
  let start = null;
  function ramp(ts) {
    if (!start) start = ts;
    flameIntensity = Math.min(1, (ts - start) / 1200);
    if (flameIntensity < 1) requestAnimationFrame(ramp);
  }
  requestAnimationFrame(ramp);
  if (!flameRaf) drawFlame();
}

/* ════════════ SMOKE ════════════ */
const smokeParticles = [];
function spawnSmoke() {
  for (let i = 0; i < 3; i++) {
    smokeParticles.push({
      x: 60 + Math.random() * 10,
      y: 150,
      vx: (Math.random() - 0.5) * 0.5,
      vy: -0.7 - Math.random() * 0.5,
      size: 4 + Math.random() * 6,
      alpha: 0.35 + Math.random() * 0.2,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.04,
    });
  }
}
let smokeInterval = null;
function drawSmoke() {
  sCtx.clearRect(0, 0, 120, 160);
  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    const s = smokeParticles[i];
    s.x += s.vx + Math.sin(s.y * 0.04) * 0.3;
    s.y += s.vy;
    s.size += 0.18;
    s.alpha -= 0.004;
    s.rot += s.rotV;
    if (s.alpha <= 0) { smokeParticles.splice(i, 1); continue; }
    sCtx.save();
    sCtx.globalAlpha = s.alpha;
    sCtx.translate(s.x, s.y);
    sCtx.rotate(s.rot);
    const sg = sCtx.createRadialGradient(0, 0, 0, 0, 0, s.size);
    sg.addColorStop(0,   'rgba(210,195,180,0.6)');
    sg.addColorStop(0.6, 'rgba(190,175,160,0.2)');
    sg.addColorStop(1,   'rgba(180,165,150,0)');
    sCtx.fillStyle = sg;
    sCtx.beginPath();
    sCtx.arc(0, 0, s.size, 0, Math.PI * 2);
    sCtx.fill();
    sCtx.restore();
  }
  smokeRaf = requestAnimationFrame(drawSmoke);
}

/* ════════════ PETALS / SPARKS ════════════ */
const particles = [];

function burstSparks(cx, cy, count, type) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.6;
    const speed = (type === 'spark') ? 3 + Math.random() * 5 : 2 + Math.random() * 4;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - (type === 'petal' ? 2 : 0),
      size: type === 'spark' ? 2 + Math.random() * 3 : 5 + Math.random() * 8,
      alpha: 0.9,
      color: type === 'spark'
        ? `hsl(${35 + Math.random() * 30},100%,${60 + Math.random() * 30}%)`
        : `hsl(${28 + Math.random() * 40},90%,${45 + Math.random() * 25}%)`,
      type,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.16,
      gravity: type === 'petal' ? 0.08 : 0.12,
      decay: type === 'petal' ? 0.012 : 0.022,
    });
  }
}

function burstMarigoldPetals() {
  /* Rain down from top */
  for (let i = 0; i < 28; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: -10 - Math.random() * 40,
      vx: (Math.random() - 0.5) * 1.8,
      vy: 1.5 + Math.random() * 2.5,
      size: 5 + Math.random() * 9,
      alpha: 0.85,
      color: `hsl(${28 + Math.random() * 45},95%,${48 + Math.random() * 22}%)`,
      type: 'petal',
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.12,
      gravity: 0.06,
      decay: 0.006,
    });
  }
}

let petalsRaf = 0;
function drawParticles() {
  pCtx.clearRect(0, 0, petalsCanvas.width, petalsCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx;
    p.y  += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.985;
    p.rot += p.rotV;
    p.alpha -= p.decay;
    if (p.alpha <= 0 || p.y > petalsCanvas.height + 20) { particles.splice(i, 1); continue; }

    pCtx.save();
    pCtx.globalAlpha = p.alpha;
    pCtx.translate(p.x, p.y);
    pCtx.rotate(p.rot);

    if (p.type === 'spark') {
      pCtx.fillStyle = p.color;
      pCtx.shadowColor = p.color;
      pCtx.shadowBlur = 6;
      pCtx.fillRect(-p.size * 0.3, -p.size * 0.3, p.size * 0.6, p.size * 0.6);
    } else {
      /* Petal shape — teardrop */
      pCtx.fillStyle = p.color;
      pCtx.beginPath();
      pCtx.moveTo(0, -p.size);
      pCtx.bezierCurveTo(p.size * 0.55, -p.size * 0.5, p.size * 0.55, p.size * 0.5, 0, p.size);
      pCtx.bezierCurveTo(-p.size * 0.55, p.size * 0.5, -p.size * 0.55, -p.size * 0.5, 0, -p.size);
      pCtx.fill();
    }
    pCtx.restore();
  }
  if (particles.length > 0 || petalsRaf) {
    petalsRaf = requestAnimationFrame(drawParticles);
  } else {
    petalsRaf = 0;
  }
}

/* ════════════ DIYA FLICKER on tap ════════════ */
function flickerDiya() {
  const dw = document.getElementById('diya-wrap');
  dw.style.transform = 'translateX(-50%) scale(1.04)';
  setTimeout(() => { dw.style.transform = 'translateX(-50%) scale(1)'; }, 160);
}

/* ════════════ WAX DRIPS ════════════ */
function addWaxDrip() {
  const drip = document.createElement('div');
  drip.className = 'wax-drip';
  const side = Math.random() > 0.5 ? 1 : -1;
  const offset = 12 + Math.random() * 16;
  const w = 5 + Math.random() * 5;
  const h = 14 + Math.random() * 20;
  const botPct = 27 + Math.random() * 4;
  drip.style.cssText = `
    left: calc(50% + ${side * offset}px);
    bottom: ${botPct}%;
    width: ${w}px;
    height: ${h}px;
  `;
  scene.appendChild(drip);
  setTimeout(() => drip.remove(), 2500);
}

/* ════════════ PROGRESS DOTS ════════════ */
function updateDots(step) {
  for (let i = 0; i < 3; i++) {
    const d = document.getElementById(`dot-${i}`);
    d.classList.remove('done', 'active');
    if (i < step) d.classList.add('done');
    else if (i === step) d.classList.add('active');
  }
}

/* ════════════ MAIN TAP HANDLER ════════════ */
function handleTap() {
  if (tapCount >= 3) return;
  tapCount++;

  flickerDiya();

  /* Burst sparks from diya position */
  const diyaRect = document.getElementById('diya-wrap').getBoundingClientRect();
  const cx = diyaRect.left + diyaRect.width / 2;
  const cy = diyaRect.top + diyaRect.height * 0.35;

  if (tapCount === 1) {
    /* First tap: ignite flame, reveal day numeral */
    scene.classList.add('lit', 'lit-1');
    igniteFlame();
    burstSparks(cx, cy, 14, 'spark');
    if (!petalsRaf) { petalsRaf = requestAnimationFrame(drawParticles); }

    setTimeout(() => {
      document.getElementById('part-day').classList.add('revealed');
      document.getElementById('rule-1').classList.add('revealed');
    }, 500);

    updateDots(1);

    /* Change hint */
    setTimeout(() => {
      document.querySelector('.hint-text').textContent = 'Tap again to reveal more';
    }, 800);
  }

  else if (tapCount === 2) {
    /* Second tap: warmer glow, reveal month */
    scene.classList.add('lit-2');
    addWaxDrip(); addWaxDrip();
    burstSparks(cx, cy, 12, 'spark');
    burstSparks(cx, cy + 20, 8, 'petal');

    setTimeout(() => {
      document.getElementById('part-month').classList.add('revealed');
      document.getElementById('rule-2').classList.add('revealed');
    }, 400);

    updateDots(2);

    document.querySelector('.hint-text').textContent = 'One more…';
  }

  else if (tapCount === 3) {
    /* Third tap: full glow, reveal year, petals rain, smoke rises */
    scene.classList.add('lit-3');
    addWaxDrip(); addWaxDrip(); addWaxDrip();

    /* Big spark + petal burst */
    burstSparks(cx, cy, 20, 'spark');
    burstSparks(cx, cy, 16, 'petal');
    setTimeout(() => burstMarigoldPetals(), 300);
    setTimeout(() => burstMarigoldPetals(), 700);
    setTimeout(() => burstMarigoldPetals(), 1200);

    /* Start smoke */
    smokeInterval = setInterval(spawnSmoke, 60);
    drawSmoke();

    /* Reveal year */
    setTimeout(() => {
      document.getElementById('part-year').classList.add('revealed');
    }, 350);

    updateDots(3); // all done

    /* Swap hint to sharing text */
    setTimeout(() => {
      const hint = document.getElementById('tap-hint');
      hint.querySelector('.hint-text').textContent = 'Share this light ♡';
      hint.querySelector('.hint-arrow').style.display = 'none';
      hint.style.animation = 'none';
      hint.style.opacity = '0.8';
    }, 1800);
  }
}

/* ════════════ REDUCED MOTION ════════════ */
if (reduced) {
  /* Show everything immediately */
  scene.className = 'lit lit-1 lit-2 lit-3';
  ['part-day','part-month','part-year'].forEach(id => {
    document.getElementById(id).classList.add('revealed');
  });
  ['rule-1','rule-2'].forEach(id => {
    document.getElementById(id).classList.add('revealed');
  });
  tapCount = 3;
  updateDots(3);
}

/* ════════════ EVENTS ════════════ */
scene.addEventListener('click', handleTap);
scene.addEventListener('touchend', (e) => { e.preventDefault(); handleTap(); }, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') handleTap();
});
</script>
</body>
