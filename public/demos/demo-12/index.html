<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden;font-family:'Share Tech Mono',monospace}

/* ══════════ GORGEOUS BACKGROUND ══════════ */
body{
  background:radial-gradient(ellipse at 20% 15%,#1a0050 0%,#08001a 40%,#040010 100%);
}

/* Animated gradient shift */
#bgLayer{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 75% 80%,rgba(80,0,160,.4) 0%,transparent 50%),
    radial-gradient(ellipse at 20% 20%,rgba(136,0,200,.3) 0%,transparent 45%),
    radial-gradient(ellipse at 50% 50%,rgba(30,0,80,.6) 0%,transparent 70%);
  animation:bg-shift 18s ease-in-out infinite alternate;
}
@keyframes bg-shift{
  0%{background:radial-gradient(ellipse at 75% 80%,rgba(80,0,160,.4) 0%,transparent 50%),radial-gradient(ellipse at 20% 20%,rgba(136,0,200,.3) 0%,transparent 45%),radial-gradient(ellipse at 50% 50%,rgba(30,0,80,.6) 0%,transparent 70%)}
  50%{background:radial-gradient(ellipse at 25% 75%,rgba(100,0,180,.35) 0%,transparent 50%),radial-gradient(ellipse at 80% 25%,rgba(160,0,220,.28) 0%,transparent 45%),radial-gradient(ellipse at 50% 50%,rgba(40,0,100,.6) 0%,transparent 70%)}
  100%{background:radial-gradient(ellipse at 60% 20%,rgba(60,0,140,.4) 0%,transparent 50%),radial-gradient(ellipse at 30% 80%,rgba(120,0,200,.3) 0%,transparent 45%),radial-gradient(ellipse at 50% 50%,rgba(20,0,70,.6) 0%,transparent 70%)}
}

/* Bokeh blobs */
.bokeh{position:fixed;border-radius:50%;pointer-events:none;z-index:1;filter:blur(70px);animation:bokeh-float ease-in-out infinite alternate;will-change:transform,opacity}
@keyframes bokeh-float{0%{transform:translate(0,0) scale(1)}100%{transform:translate(var(--dx,20px),var(--dy,-15px)) scale(1.1)}}

/* Stars */
#stars{position:fixed;inset:0;z-index:2;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.05;transform:scale(1)}50%{opacity:.85;transform:scale(1.8)}}

/* Scanlines — subtle */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(150,80,255,.018) 3px,rgba(150,80,255,.018) 4px)}

/* Vignette */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.72) 100%)}

/* ══════════ PAGE ══════════ */
.page{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1.5rem 1rem 3rem}

/* ══════════ TERMINAL ══════════ */
.terminal{width:min(700px,97vw);border-radius:12px;overflow:hidden;
  border:1px solid rgba(168,85,247,.35);
  box-shadow:
    0 0 0 1px rgba(168,85,247,.08),
    0 0 50px rgba(168,85,247,.15),
    0 0 100px rgba(168,85,247,.06),
    0 30px 80px rgba(0,0,0,.7);
}

/* Title bar */
.tbar{background:rgba(30,0,60,.9);border-bottom:1px solid rgba(168,85,247,.2);
  padding:.6rem 1rem;display:flex;align-items:center;gap:.55rem;backdrop-filter:blur(12px)}
.dot{width:11px;height:11px;border-radius:50%}
.dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
.tbar-title{flex:1;text-align:center;font-size:10px;color:rgba(168,85,247,.5);letter-spacing:.22em}

/* Body */
.tbody{
  background:rgba(8,0,24,.88);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:1.3rem 1.6rem 1.8rem;min-height:300px;
  font-size:clamp(11px,2vw,13px);line-height:1.85;
  border-top:none;
}

/* Line types */
.l-sys{color:rgba(168,85,247,.7)}
.l-ok{color:#c084fc}
.l-love{color:#f9a8d4;font-style:italic}
.l-warn{color:#fbbf24}
.l-hi{color:#e879f9}
.l-ask{color:#f9a8d4;font-size:clamp(13px,2.8vw,17px);font-weight:700;margin-top:.4rem}
.l-dim{color:rgba(168,85,247,.4)}

.pre{color:rgba(168,85,247,.5);user-select:none}
.cur{display:inline-block;width:9px;height:1.1em;background:#c084fc;vertical-align:text-bottom;animation:blink 1s step-start infinite;margin-left:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Progress bar */
.prog-wrap{height:3px;background:rgba(168,85,247,.15);border-radius:2px;overflow:hidden;margin:.18rem 0}
.prog-fill{height:100%;background:linear-gradient(to right,#7c3aed,#c084fc,#e879f9);border-radius:2px;width:0;transition:width .04s linear}

/* Stats grid */
.stats{margin:.6rem 0;padding:.8rem 1.1rem;
  border:1px solid rgba(168,85,247,.14);border-radius:8px;
  background:rgba(168,85,247,.04);
  display:grid;grid-template-columns:1fr 1fr;gap:.22rem 1.4rem;font-size:11px}
.sk{color:rgba(168,85,247,.6)}.sv{color:#c084fc}

/* Buttons */
.btn-row{margin-top:1.2rem;display:flex;gap:.7rem;flex-wrap:wrap}
.btn{background:transparent;border-radius:6px;padding:.5rem 1.4rem;font-family:'Share Tech Mono',monospace;font-size:13px;cursor:pointer;transition:background .12s,color .12s,box-shadow .12s;letter-spacing:.05em}
.btn-yes{color:#e879f9;border:1px solid rgba(232,121,249,.5)}
.btn-yes:hover{background:rgba(232,121,249,.12);box-shadow:0 0 18px rgba(232,121,249,.25)}
.btn-no{color:rgba(168,85,247,.38);border:1px solid rgba(168,85,247,.2);font-size:12px}
.btn-no:hover{background:rgba(168,85,247,.06)}
.hint-t{margin-top:.35rem;font-size:10px;color:rgba(168,85,247,.28);min-height:15px;transition:color .3s}

/* ══════════ CELEBRATE ══════════ */
#celebrate{display:none;position:fixed;inset:0;z-index:200;
  background:radial-gradient(ellipse at 50% 40%,#120030 0%,#06001a 55%,#040010 100%);
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;
  overflow:hidden}
#celebrate.show{display:flex;animation:cel-in .6s cubic-bezier(.22,1,.36,1) both}
@keyframes cel-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* Celebrate bg orbs */
#celebOrbs{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.c-orb{position:absolute;border-radius:50%;filter:blur(80px);animation:orb-drift ease-in-out infinite alternate}

/* ASCII */
.cel-ascii{font-size:clamp(10px,2.4vw,15px);line-height:1.35;
  background:linear-gradient(135deg,#e879f9,#c084fc,#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  white-space:pre;position:relative;z-index:10;
  animation:ascii-pulse 3s ease-in-out infinite}
@keyframes ascii-pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}

.cel-title{margin-top:1.8rem;font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:clamp(2.4rem,7vw,4.2rem);color:#fff;line-height:1;
  text-shadow:0 0 40px rgba(232,121,249,.4);position:relative;z-index:10}
.cel-title em{color:#e879f9;font-style:italic}
.cel-sub{margin-top:.4rem;font-size:clamp(9px,1.8vw,11px);font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:rgba(232,121,249,.5);position:relative;z-index:10}

.cel-term{margin-top:1.6rem;padding:.85rem 1.4rem;
  border:1px solid rgba(168,85,247,.2);border-radius:8px;
  background:rgba(168,85,247,.04);backdrop-filter:blur(16px);
  max-width:520px;width:100%;font-size:11.5px;line-height:1.9;color:rgba(196,132,252,.75);text-align:left;
  position:relative;z-index:10}

.cel-wa{margin-top:1.6rem;display:inline-flex;align-items:center;gap:.55rem;background:#25d366;color:#fff;border:none;border-radius:8px;
  padding:.72rem 1.8rem;font-family:'Share Tech Mono',monospace;font-size:13px;cursor:pointer;text-decoration:none;letter-spacing:.05em;
  transition:box-shadow .2s;position:relative;z-index:10}
.cel-wa:hover{box-shadow:0 0 22px rgba(37,211,102,.5)}
.cel-brand{margin-top:1.1rem;font-size:9px;color:rgba(168,85,247,.22);letter-spacing:.28em;text-transform:uppercase;position:relative;z-index:10}
.cel-brand a{color:#e879f9;text-decoration:none}

.particle{position:fixed;pointer-events:none;animation:part-fly ease-out forwards;z-index:210}
@keyframes part-fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--px),var(--py)) scale(.25)}}
</style>
</head>
<body>
<div id="bgLayer"></div>

<!-- Bokeh -->
<div class="bokeh" style="width:420px;height:420px;top:-8%;left:-8%;background:radial-gradient(circle,rgba(120,0,220,.5),transparent 70%);--dx:18px;--dy:-14px;animation-duration:14s"></div>

  <a href="https://wa.me/919999999999?text=She+said+yes+💜+I+want+a+proposal+page" class="cel-wa" target="_blank" rel="noopener">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.553 4.118 1.528 5.857L.057 23.428a.5.5 0 0 0 .623.602l5.694-1.488A11.942 11.942 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.9a9.858 9.858 0 0 1-5.031-1.376l-.36-.214-3.73.976.994-3.63-.234-.374A9.859 9.859 0 0 1 2.1 12C2.1 6.53 6.53 2.1 12 2.1c5.47 0 9.9 4.43 9.9 9.9 0 5.47-4.43 9.9-9.9 9.9z"/></svg>

<script>
/* Stars */
const sf=document.getElementById('stars');
for(let i=0;i<160;i++){const s=document.createElement('div');s.className='star';const sz=.5+Math.random()*2;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${1.8+Math.random()*5}s;animation-delay:${-Math.random()*7}s`;sf.appendChild(s);}

/* Queue typewriter */
const tbody=document.getElementById('tbody');
let Q=[],running=false;
function q(type,opts={},delay=0){Q.push({type,...opts,delay});}
function run(){if(running||!Q.length)return;running=true;const item=Q.shift();setTimeout(()=>proc(item),item.delay||0);}
function scroll(){tbody.scrollTop=tbody.scrollHeight;}

function proc(item){
  if(item.type==='blank'){tbody.appendChild(Object.assign(document.createElement('div'),{style:'height:.35rem'}));running=false;run();}
  else if(item.type==='line'){
    const d=document.createElement('div');d.className=item.cls||'l-ok';
    d.innerHTML='<span class="pre">&gt; </span>'+item.text;tbody.appendChild(d);scroll();running=false;run();
  }
  else if(item.type==='typed'){
    const d=document.createElement('div');d.className=item.cls||'l-ok';
    d.innerHTML='<span class="pre">&gt; </span>';
    const sp=document.createElement('span');d.appendChild(sp);
    const cur=document.createElement('span');cur.className='cur';d.appendChild(cur);
    tbody.appendChild(d);scroll();
    let i=0;const t=setInterval(()=>{if(i<item.text.length){sp.textContent+=item.text[i++];scroll();}else{clearInterval(t);cur.remove();running=false;run();}},item.speed||32);
  }
  else if(item.type==='progress'){
    const d=document.createElement('div');d.className='l-dim';
    d.innerHTML='<span class="pre">&gt; </span>'+item.label;
    const pw=document.createElement('div');pw.className='prog-wrap';
    const pf=document.createElement('div');pf.className='prog-fill';pw.appendChild(pf);d.appendChild(pw);
    tbody.appendChild(d);scroll();
    let w=0;const t=setInterval(()=>{w+=Math.random()*4.8+1.2;pf.style.width=Math.min(w,100)+'%';if(w>=100){clearInterval(t);running=false;run();}},26);
  }
  else if(item.type==='stats'){
    const s=document.createElement('div');s.className='stats';
    [['love.uptime','100%'],['missed_calls','0 (impossible)'],['happiness_level','∞ / ∞'],['status','forever_with_you.exe'],['trust_score','MAX'],['inside_jokes_db','∞ entries loaded']].forEach(([k,v])=>{
      s.appendChild(Object.assign(document.createElement('span'),{className:'sk',textContent:k}));
      s.appendChild(Object.assign(document.createElement('span'),{className:'sv',textContent:'→ '+v}));
    });
    tbody.appendChild(s);scroll();running=false;run();
  }
  else if(item.type==='buttons'){
    const row=document.createElement('div');row.className='btn-row';
    const y=document.createElement('button');y.className='btn btn-yes';y.innerHTML='[ YES ♥ ] — Accept';y.onclick=onYes;
    const n=document.createElement('button');n.className='btn btn-no';n.innerHTML='[ no ]';n.id='btnNo';n.onmouseover=onNoHover;
    row.appendChild(y);row.appendChild(n);tbody.appendChild(row);
    const h=document.createElement('div');h.className='hint-t';h.id='hintT';h.textContent='Hover over [ no ] to see what the system does…';
    tbody.appendChild(h);scroll();running=false;
  }
}

/* Boot sequence */
const BOOT=[
  ()=>q('line',{text:'Booting LoveOS v2.0…',cls:'l-sys'},0),
  ()=>q('progress',{label:'Initializing HeartKernel…'},200),
  ()=>q('line',{text:'HeartKernel v3.1.4 loaded ✓',cls:'l-ok'},80),
  ()=>q('progress',{label:'Loading emotional modules…'},220),
  ()=>q('line',{text:'trust.so &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;→ ok',cls:'l-ok'},70),
  ()=>q('line',{text:'patience.so &nbsp;&nbsp;→ ok',cls:'l-ok'},70),
  ()=>q('line',{text:'honesty.so &nbsp;&nbsp;&nbsp;→ ok',cls:'l-ok'},70),
  ()=>q('line',{text:'inside_jokes.db → loaded (∞ entries)',cls:'l-ok'},80),
  ()=>q('line',{text:'<span style="color:#fbbf24">WARNING:</span> \'personal_space\' module deprecated',cls:'l-warn'},120),
  ()=>q('line',{text:'<span style="color:#fbbf24">[WARN]</span> feelings.buffer at 94% capacity',cls:'l-warn'},150),
  ()=>q('blank',{},55),
  ()=>q('progress',{label:'Scanning for: YOU…'},290),
  ()=>q('line',{text:'User detected: You ♥',cls:'l-love'},90),
  ()=>q('line',{text:'Connecting to HeartServer@forever.love…',cls:'l-sys'},110),
  ()=>q('line',{text:'Connection established · latency: 0ms ✓',cls:'l-ok'},190),
  ()=>q('blank',{},45),
  ()=>q('typed',{text:'Loading your memories…',cls:'l-sys',speed:26},70),
  ()=>q('line',{text:'♥ hoodie_permanently_stolen.tar.gz extracted',cls:'l-ok'},85),
  ()=>q('line',{text:'♥ 2am_conversations.json parsed (size: ∞)',cls:'l-ok'},80),
  ()=>q('line',{text:'♥ the_moment_i_knew.cache → warm hit',cls:'l-ok'},80),
  ()=>q('line',{text:'♥ that_time_you_were_right.txt → 1 byte',cls:'l-warn'},110),
  ()=>q('blank',{},50),
  ()=>q('progress',{label:'gcc -O3 -o love heart.c feelings.c forever.c'},265),
  ()=>q('line',{text:'Build successful · 0 errors · 0 warnings ✓',cls:'l-hi'},80),
  ()=>q('line',{text:'Running foreverWithYou.exe…',cls:'l-sys'},110),
  ()=>q('blank',{},55),
  ()=>q('stats',{},80),
  ()=>q('blank',{},90),
  ()=>q('typed',{text:'System requires your confirmation:',cls:'l-ask',speed:20},110),
  ()=>q('line',{text:'Will you be mine? (y/n)',cls:'l-ask'},70),
  ()=>q('buttons',{},580),
];
let bi=0;function nb(){if(bi<BOOT.length){BOOT[bi++]();run();setTimeout(nb,bi<4?200:bi<12?305:bi<22?245:185);}}
nb();

/* No hover */
let nc=0;
const phrases=['no…','really?','you sure?','…think again','loading rejection damage 💜','my heart.exe crashed','come on…','last chance 🥺','still no??','ok. ok. i respect it.'];
function onNoHover(){
  const btn=document.getElementById('btnNo');if(!btn||nc>=9)return;nc++;
  btn.textContent='[ '+phrases[Math.min(nc,phrases.length-1)]+' ]';
  const h=document.getElementById('hintT');
  const hmsg=['cute. trying to avoid this?','the button is judging you.','you enjoy chaos.','running out of phrases…','this is getting suspicious.','it\'s becoming personal.','still here??','legend.','[ no ] has disconnected.'];
  if(h){h.textContent=hmsg[Math.min(nc-1,hmsg.length-1)];h.style.color='rgba(249,168,212,.55)';}
  if(nc>=5){btn.style.fontSize='10px';btn.style.opacity='.35';}
  if(nc>=9){btn.style.display='none';if(h)h.textContent='[ no ] has been removed from the registry.';}
}

/* Yes */
function onYes(){
  const glyphs=['♥','💜','✨','💕','♡','⭐'];
  for(let i=0;i<60;i++){
    const p=document.createElement('div');p.className='particle';
    const a=Math.random()*Math.PI*2,d=100+Math.random()*230;
    p.style.setProperty('--px',(Math.cos(a)*d)+'px');p.style.setProperty('--py',(Math.sin(a)*d-90)+'px');
    p.textContent=glyphs[i%glyphs.length];p.style.left=(20+Math.random()*60)+'%';p.style.top=(28+Math.random()*40)+'%';
    p.style.fontSize=(12+Math.random()*8)+'px';
    p.style.animationDuration=(.55+Math.random()*.9)+'s';p.style.animationDelay=(Math.random()*.3)+'s';
    document.body.appendChild(p);setTimeout(()=>p.remove(),1700);
  }
  setTimeout(showCel,400);
}

function showCel(){
  document.getElementById('celAscii').textContent=`
  ██╗      ██████╗ ██╗   ██╗███████╗
  ██║     ██╔═══██╗██║   ██║██╔════╝
  ██║     ██║   ██║██║   ██║█████╗
  ██║     ██║   ██║╚██╗ ██╔╝██╔══╝
  ███████╗╚██████╔╝ ╚████╔╝ ███████╗
  ╚══════╝ ╚═════╝   ╚═══╝  ╚══════╝
        ♥  CONFIRMED  ♥`;
  const ct=document.getElementById('celTerm');
  ['> love.status = CONFIRMED ✓','> happiness.set(MAXIMUM)','> forever_with_you.exe --start','> git add .','> git commit -m "She said yes 💜"','> git push origin main','> remote: Love accepted. PR merged into main ♥'].forEach((l,i)=>{
    setTimeout(()=>{const d=document.createElement('div');d.textContent=l;ct.appendChild(d);ct.scrollTop=99999;},i*310);
  });
  document.getElementById('celebrate').classList.add('show');
}
</script>
