<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Will You Be Mine? 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;1,400&display=swap" />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<noscript><link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;1,400&display=swap" rel="stylesheet"/></noscript>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif}

/* ═══════════════ BACKGROUND ═══════════════ */
#bg-layer{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(145deg,#ff5c8a 0%,#ff7fa8 22%,#ffadc4 48%,#ffd1dc 72%,#ffe8ef 100%);
  transition:background 1.2s ease;
}
/* Top shimmer */
#bg-layer::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% -10%,rgba(255,255,255,.42) 0%,transparent 55%);
  animation:shimmer 5s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.7}50%{opacity:1}}

/* Bubble particles */
#bubbles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.bubble{position:absolute;border-radius:50%;animation:brise linear infinite;opacity:0}
@keyframes brise{0%{opacity:0;transform:translateY(0) scale(1)}5%{opacity:.3}90%{opacity:.14}100%{opacity:0;transform:translateY(-110vh) scale(1.7)}}

/* ═══════════════ SLIDES ═══════════════ */
.slide{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;pointer-events:none;opacity:0;transition:opacity .65s ease}
.slide.active{pointer-events:auto;opacity:1}

/* ═══════════════ SLIDE 1: Question ═══════════════ */
.s1-inner{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;text-align:center}

/* Circular GIF frame */
.gif-frame{width:min(210px,56vw);height:min(210px,56vw);border-radius:50%;overflow:hidden;
  border:4px solid rgba(255,255,255,.75);
  box-shadow:0 0 0 8px rgba(255,255,255,.22),0 18px 44px rgba(220,50,90,.3);
  margin-bottom:1.8rem;animation:frame-float 3.8s ease-in-out infinite,gfin .9s .2s cubic-bezier(.22,1,.36,1) both}
@keyframes frame-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.02)}}
@keyframes gfin{from{opacity:0;transform:scale(.8) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
.gif-frame img{width:100%;height:100%;object-fit:cover}

/* Title */
.q-title{font-family:'Pacifico',cursive;font-size:clamp(2.1rem,7vw,3.3rem);color:#fff;
  text-shadow:0 3px 18px rgba(200,30,60,.38),0 1px 4px rgba(0,0,0,.1);line-height:1.2;margin-bottom:.5rem;
  animation:title-pop .9s .35s cubic-bezier(.34,1.56,.64,1) both}
@keyframes title-pop{from{opacity:0;transform:scale(.72) translateY(22px)}to{opacity:1;transform:none}}
.q-sub{font-size:15px;color:rgba(255,255,255,.9);margin-bottom:2.4rem;font-weight:600;animation:title-pop .8s .6s both}

/* Buttons */
.btn-zone{position:relative;width:min(360px,90vw);min-height:90px;display:flex;align-items:center;justify-content:center}
.btn-yes{
  background:linear-gradient(135deg,#fff 0%,#fff5f7 100%);color:#e91e6a;border:none;border-radius:2.2rem;
  padding:1rem 3rem;font-family:'Nunito',sans-serif;font-size:1.2rem;font-weight:900;cursor:pointer;letter-spacing:.03em;
  box-shadow:0 8px 28px rgba(220,50,80,.3),0 2px 8px rgba(0,0,0,.1);
  transition:transform .2s,box-shadow .2s;display:inline-flex;align-items:center;gap:.45rem;
  animation:yes-pulse 2.2s ease-in-out infinite,title-pop .8s .9s both;
  position:relative;z-index:3;
}
@keyframes yes-pulse{0%,100%{box-shadow:0 8px 28px rgba(220,50,80,.3),0 0 0 0 rgba(255,255,255,.45)}65%{box-shadow:0 8px 28px rgba(220,50,80,.3),0 0 0 18px rgba(255,255,255,0)}}
.btn-yes:hover{transform:scale(1.08) translateY(-2px);box-shadow:0 14px 36px rgba(220,50,80,.42)}
.btn-yes:active{transform:scale(.96)}

/* NO — runs away from cursor */
.btn-no{
  position:fixed;z-index:20;
  background:rgba(255,255,255,.28);color:#fff;border:2px solid rgba(255,255,255,.55);
  border-radius:1.8rem;padding:0 1.5rem;height:46px;
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;white-space:nowrap;
  backdrop-filter:blur(6px);
  transition:left .36s cubic-bezier(.22,1,.36,1),top .36s cubic-bezier(.22,1,.36,1),transform .22s;
}
.btn-no:hover{background:rgba(255,255,255,.38)}

.hint-line{margin-top:1.1rem;font-size:11.5px;color:rgba(255,255,255,.52);font-style:italic;min-height:18px;transition:opacity .3s;animation:title-pop .7s 1.3s both}

/* ═══════════════ SLIDE 2: Oh yes! ═══════════════ */
.s2-gif{width:min(195px,52vw);height:min(195px,52vw);border-radius:50%;overflow:hidden;
  border:4px solid rgba(255,255,255,.78);
  box-shadow:0 0 0 10px rgba(255,255,255,.2),0 22px 52px rgba(200,30,60,.42);
  margin-bottom:1.5rem;animation:frame-float 3s ease-in-out infinite}
.s2-gif img{width:100%;height:100%;object-fit:cover}

.s2-title{font-family:'Pacifico',cursive;font-size:clamp(2.8rem,10vw,5rem);color:#fff;
  text-shadow:0 4px 24px rgba(200,30,60,.42);line-height:1;margin-bottom:.5rem;animation:title-pop .7s .2s both;text-align:center}
.s2-sub{font-size:clamp(1.1rem,3vw,1.4rem);font-weight:700;color:rgba(255,255,255,.92);margin-bottom:.5rem;animation:title-pop .7s .4s both;text-align:center}
.s2-msg{font-family:'Cormorant Garamond',serif;font-size:clamp(1.05rem,2.5vw,1.22rem);color:rgba(255,255,255,.82);font-style:italic;line-height:1.83;max-width:380px;margin:.7rem auto 1.2rem;animation:title-pop .7s .6s both;text-align:center}
.s2-btn{margin-bottom:1.2rem;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.45);border-radius:999px;padding:0 1.8rem;height:46px;font-family:'Nunito',sans-serif;font-size:13.5px;font-weight:700;color:#fff;cursor:pointer;backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:.5rem;transition:background .2s;animation:title-pop .6s 1s both}
.s2-btn:hover{background:rgba(255,255,255,.25)}

/* ═══════════════ SLIDE 3: The real message ═══════════════ */
.s3-wrap{max-width:500px;text-align:center;padding:0 1rem}
.s3-icon{font-size:clamp(4rem,10vw,5rem);margin-bottom:1rem;animation:icon-pop .65s .2s cubic-bezier(.34,1.56,.64,1) both;filter:drop-shadow(0 4px 18px rgba(255,50,100,.4))}
@keyframes icon-pop{from{opacity:0;transform:scale(0) rotate(-15deg)}to{opacity:1;transform:none}}
.s3-msg{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.1rem,2.8vw,1.4rem);color:#fff;line-height:1.88;margin-bottom:2rem;animation:title-pop .8s .5s both;text-shadow:0 2px 10px rgba(200,30,60,.25)}
.s3-wa{display:inline-flex;align-items:center;gap:.6rem;background:#fff;color:#e91e6a;border:none;border-radius:2rem;padding:.9rem 2.2rem;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;text-decoration:none;cursor:pointer;box-shadow:0 6px 22px rgba(220,50,80,.22);animation:title-pop .7s .9s both;transition:transform .2s,box-shadow .2s;margin-bottom:1rem}
.s3-wa:hover{transform:scale(1.05);box-shadow:0 8px 28px rgba(220,50,80,.32)}
.s3-brand{font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.32);animation:title-pop .6s 1.1s both}
</style>
</head>
<body>
<div id="bg-layer"></div>
<div id="bubbles"></div>

<!-- ═══ SLIDE 1 ═══ -->
<div class="slide active" id="s1">
  <div class="s1-inner">
    <div class="gif-frame">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZWxhaHpieWV2bjN5cjZ4ajl0emx1dzFrMHd1aDNhYWRyZnZyaXZtayZlcD12MV9naWZzX3NlYXJjaCZjdD1n/35DmVHlLURCWBxmK8j/giphy.gif" alt="" crossorigin="anonymous"/>
    </div>
    <h1 class="q-title">Will you be<br/>my girlfriend? ❤️</h1>
    <p class="q-sub">Every moment with you feels magical 💕</p>
    <div class="btn-zone" id="btnZone1">
      <button class="btn-yes" onclick="onYes()">YES ❤️</button>
    </div>
    <p class="hint-line" id="hintLine">Try moving toward "No" 👀</p>
  </div>
</div>

<!-- ═══ SLIDE 2 ═══ -->
<div class="slide" id="s2">
  <div class="s2-gif">
    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZWxhaHpieWV2bjN5cjZ4ajl0emx1dzFrMHd1aDNhYWRyZnZyaXZtayZlcD12MV9naWZzX3NlYXJjaCZjdD1n/35DmVHlLURCWBxmK8j/giphy.gif" alt="" crossorigin="anonymous"/>
  </div>
  <h2 class="s2-title">Yeahhhh! 😍🎉</h2>
  <p class="s2-sub">You're now officially stuck with me 😗</p>
  <p class="s2-msg">"I love you more than I can put into words — but I'm going to spend forever trying."</p>
  <button class="s2-btn" onclick="goS3()">✦ There's one more thing I want to say</button>
</div>

<!-- ═══ SLIDE 3 ═══ -->
<div class="slide" id="s3">
  <div class="s3-wrap">
    <span class="s3-icon">💌</span>
    <p class="s3-msg" id="s3msg"></p>
    <a class="s3-wa" href="tel:+917385893966">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>
      Make her one — from ₹499
    </a>
    <p class="s3-brand">Powered by OurMoment</p>
  </div>
</div>

<!-- NO button — runs away -->
<button class="btn-no" id="btnNo"><span id="noE">😐</span> <span id="noT">NO</span></button>

<script>
/* Bubbles */
const bubs=document.getElementById('bubbles');
for(let i=0;i<22;i++){const b=document.createElement('div');b.className='bubble';const sz=10+Math.random()*44;b.style.cssText=`width:${sz}px;height:${sz}px;background:rgba(255,255,255,${.06+Math.random()*.16});left:${Math.random()*100}%;bottom:${-sz}px;animation-duration:${7+Math.random()*11}s;animation-delay:${-Math.random()*16}s`;bubs.appendChild(b);}

/* Slides */
let cur=0;
function goSlide(n){
  ['s1','s2','s3'].forEach((id,i)=>{
    const el=document.getElementById(id);
    el.classList.remove('active');if(i===n)el.classList.add('active');
  });
  cur=n;
}

/* No button — runs from cursor */
const noBtn=document.getElementById('btnNo'),noE=document.getElementById('noE'),noT=document.getElementById('noT'),hintLine=document.getElementById('hintLine');
let nc=0,noOn=false;
const stages=[{e:'😟',t:'No…'},{e:'😰',t:'Still no'},{e:'😱',t:'STOP'},{e:'🫣',t:'Running!'},{e:'🙈',t:'NOPE'},{e:'🏃',t:'Catch me!'},{e:'💨',t:'...no'},{e:'🤪',t:'Never!'},{e:'👻',t:'Boo—No'}];
const hints=['Caught you looking 👀','It ran away again!','You can\'t catch it 😄','Almost got it!','Just click YES instead 💕','It really doesn\'t want to be clicked','OK this is just fun now','Chaos. Pure chaos.'];

noBtn.style.left=(window.innerWidth*.72)+'px';noBtn.style.top=(window.innerHeight*.72)+'px';
setTimeout(()=>{noOn=true;},900);

function runNo(){
  nc++;const s=stages[Math.min(nc-1,stages.length-1)];
  noE.textContent=s.e;noT.textContent=s.t;
  if(hintLine)hintLine.textContent=hints[Math.min(nc-1,hints.length-1)];
  const vw=window.innerWidth,vh=window.innerHeight,bw=noBtn.offsetWidth||100,bh=noBtn.offsetHeight||46;
  let nx,ny,t=0;
  do{nx=36+Math.random()*(vw-bw-72);ny=36+Math.random()*(vh-bh-72);t++;}
  while(t<30&&Math.hypot(nx-vw/2,ny-vh/2)<Math.min(vw,vh)*.22);
  noBtn.style.left=nx+'px';noBtn.style.top=ny+'px';
  noBtn.style.transform=`rotate(${(Math.random()-.5)*22}deg)`;
}

document.addEventListener('mousemove',e=>{if(!noOn||cur!==0)return;const r=noBtn.getBoundingClientRect();if(Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))<90)runNo();});
document.addEventListener('touchmove',e=>{if(!noOn||cur!==0)return;const t=e.touches[0];const r=noBtn.getBoundingClientRect();if(Math.hypot(t.clientX-(r.left+r.width/2),t.clientY-(r.top+r.height/2))<72)runNo();},{passive:true});

/* Yes */
function onYes(){
  noOn=false;noBtn.style.display='none';
  const colors=['#ff4b6e','#ff8ba7','#ffc3d4','#ffffff','#8B2FC9','#ffb347'];
  const end=Date.now()+3200;
  (function frame(){confetti({particleCount:4,angle:60,spread:120,origin:{x:0},colors});confetti({particleCount:4,angle:120,spread:120,origin:{x:1},colors});if(Date.now()<end)requestAnimationFrame(frame);})();
  confetti({particleCount:88,spread:360,startVelocity:27,decay:.9,scalar:.9,origin:{x:.5,y:.45},shapes:['circle'],colors});
  setTimeout(()=>{goSlide(1);document.getElementById('bg-layer').style.background='linear-gradient(145deg,#e01060 0%,#ff4080 25%,#ff7faa 55%,#ffb0c4 80%,#ffd8e8 100%)';setTimeout(()=>confetti({particleCount:100,spread:180,startVelocity:30,origin:{x:.5,y:.3},colors}),500);},700);
}

/* Slide 2 → 3 with typewriter */
function goS3(){
  goSlide(2);
  const msg="I've been thinking about how you look when you laugh at something unexpected. How you hold things carefully, like they matter. How being near you makes ordinary moments feel like they mean something.\n\nI don't know how to be small about this anymore. I like you — a lot. And I'm glad you said yes.";
  const el=document.getElementById('s3msg');let i=0;
  function tick(){if(i>=msg.length)return;const ch=msg[i++];if(ch==='\n'){el.appendChild(document.createElement('br'));if(msg[i]==='\n'){el.appendChild(document.createElement('br'));i++;}}else el.appendChild(document.createTextNode(ch));let d=18;if('.!?'.includes(ch))d=230;else if(ch===',')d=75;else if(Math.random()<.03)d=95;setTimeout(tick,d);}
  setTimeout(tick,300);
}
</script>
</body>
</html>
