<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="50%" stop-color="#fff1f5"/>
      <stop offset="100%" stop-color="#ffe4ed"/>
    </linearGradient>
    <radialGradient id="shimmer6" cx="50%" cy="-10%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="btn6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4b6e"/>
      <stop offset="100%" stop-color="#ff69b4"/>
    </linearGradient>
  </defs>
  <!-- Soft pink gradient BG -->
  <rect width="600" height="400" fill="url(#bg6)"/>
  <rect width="600" height="400" fill="url(#shimmer6)"/>
  <!-- Floating orbs -->
  <circle cx="70"  cy="90"  r="40" fill="rgba(255,105,180,0.08)"/>
  <circle cx="540" cy="70"  r="26" fill="rgba(168,85,247,0.10)"/>
  <circle cx="90"  cy="330" r="32" fill="rgba(255,105,180,0.07)"/>
  <circle cx="540" cy="330" r="42" fill="rgba(168,85,247,0.06)"/>
  <!-- 5 concept chips (mini progress) -->
  <g transform="translate(0,0)">
    <g opacity="0.9">
      <rect x="300" y="70" width="120" height="10" rx="5" fill="rgba(255,105,180,0.18)"/>
    </g>
    <circle cx="300" cy="75" r="7" fill="#ff4b6e"/><circle cx="330" cy="75" r="7" fill="#ff85a1"/>
    <circle cx="360" cy="75" r="7" fill="#a855f7"/><circle cx="390" cy="75" r="7" fill="#ffb347"/>
    <circle cx="420" cy="75" r="7" fill="#2dd4bf"/>
  </g>
  <!-- Mini LoveOS terminal -->
  <g transform="translate(150,96)">
    <rect x="0" y="0" width="300" height="128" rx="12" fill="rgba(255,240,245,0.95)" stroke="#ff69b4" stroke-width="2"
      filter="drop-shadow(0 14px 30px rgba(255,105,180,0.30))"/>
    <rect x="0" y="0" width="300" height="26" rx="12" fill="#ffe4ef"/>
    <circle cx="16" cy="13" r="5" fill="#ff5f56"/><circle cx="32" cy="13" r="5" fill="#ffbd2e"/><circle cx="48" cy="13" r="5" fill="#27c93f"/>
    <text x="150" y="18" font-family="sans-serif" font-size="8" font-weight="700" letter-spacing="2" fill="#ff69b4" text-anchor="middle">LoveOS SYSTEM TERMINAL</text>
    <text x="16" y="52" font-family="monospace" font-size="9" fill="rgba(255,105,180,0.7)">◆ Loading HeartKernel ...</text>
    <text x="16" y="70" font-family="monospace" font-size="9" fill="#ff4b6e">→ love.core ... ACTIVATED ✓</text>
    <text x="16" y="88" font-family="monospace" font-size="9" fill="#ff4b6e">→ memories.db ... ∞ LOADED</text>
    <rect x="16" y="96" width="268" height="4" rx="2" fill="rgba(255,105,180,0.2)"/>
    <rect x="16" y="96" width="205" height="4" rx="2" fill="url(#btn6)"/>
    <text x="16" y="118" font-family="sans-serif" font-size="9" fill="#ff4b6e">💗 FOUND! Connection established</text>
  </g>
  <!-- Concept icons row -->
  <g transform="translate(0,0)">
    <text x="150" y="258" font-size="18" text-anchor="middle">🍯</text>
    <text x="240" y="258" font-size="18" text-anchor="middle">🗺️</text>
    <text x="330" y="258" font-size="18" text-anchor="middle">✨</text>
    <text x="420" y="258" font-size="18" text-anchor="middle">💌</text>
    <text x="510" y="258" font-size="18" text-anchor="middle">💖</text>
  </g>
  <!-- Title -->
  <text x="300" y="285" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#880E4F"
    text-anchor="middle" filter="drop-shadow(0 2px 8px rgba(255,105,180,0.35))">5 Experiences in One Journey</text>
  <text x="300" y="308" font-family="sans-serif" font-size="12" font-weight="600" fill="rgba(136,14,79,0.75)" text-anchor="middle">Terminal • Memory Jar • Adventure • Cosmic • Letter</text>
  <!-- YES / NO buttons -->
  <rect x="178" y="326" width="124" height="40" rx="20" fill="url(#btn6)" filter="drop-shadow(0 6px 16px rgba(255,75,110,0.40))"/>
  <text x="240" y="352" font-family="sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">YES! Forever ❤️</text>
  <rect x="348" y="336" width="70" height="30" rx="15" fill="rgba(255,105,180,0.15)" stroke="rgba(255,105,180,0.5)" stroke-width="1.5"/>
  <text x="383" y="356" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(136,14,79,0.7)" text-anchor="middle">NO</text>
</svg>