<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="60%" stop-color="#fff1f5"/>
      <stop offset="100%" stop-color="#fff8f0"/>
    </radialGradient>
    <radialGradient id="orb1" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="rgba(255,133,161,0.5)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="orb2" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="rgba(168,85,247,0.35)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="card4" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)"/>
    </radialGradient>
    <radialGradient id="heart4" cx="38%" cy="33%" r="60%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="50%" stop-color="#ff4d7d"/>
      <stop offset="100%" stop-color="#e91e8c"/>
    </radialGradient>
  </defs>
  <!-- Mesh BG -->
  <rect width="600" height="400" fill="url(#bg4)"/>
  <rect width="600" height="400" fill="url(#orb1)"/>
  <rect width="600" height="400" fill="url(#orb2)"/>
  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,77,125,0.12)"/>
  </pattern>
  <rect width="600" height="400" fill="url(#dots)"/>
  <!-- Glass card -->
  <rect x="125" y="40" width="350" height="320" rx="40" fill="url(#card4)" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"
    filter="drop-shadow(0 20px 40px rgba(255,77,125,0.15))"/>
  <!-- Gloss top -->
  <ellipse cx="300" cy="85" rx="155" ry="60" fill="rgba(255,255,255,0.4)"/>
  <!-- Gift ribbon -->
  <text x="140" y="75" font-size="32" transform="rotate(-35,140,75)">🎁</text>
  <!-- Sparkles -->
  <text x="440" y="68" font-size="18">✨</text>
  <text x="448" y="330" font-size="14">⭐</text>
  <text x="145" y="340" font-size="15">✦</text>
  <!-- Heart circle -->
  <circle cx="300" cy="148" r="40" fill="url(#heart4)"
    filter="drop-shadow(0 6px 16px rgba(255,77,125,0.5))"/>
  <text x="300" y="158" font-size="28" text-anchor="middle" dominant-baseline="middle">♥</text>
  <!-- Tap hint -->
  <text x="300" y="202" font-family="sans-serif" font-size="9" fill="rgba(255,77,125,0.5)" text-anchor="middle" letter-spacing="1.5">HOLD THE HEART ♥</text>
  <!-- Title -->
  <text x="300" y="235" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#ff4d7d" text-anchor="middle">Will you be my</text>
  <text x="300" y="268" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#ff4d7d" text-anchor="middle">Valentine?</text>
  <!-- Subtitle -->
  <text x="300" y="292" font-family="Georgia, serif" font-size="12" font-style="italic" fill="rgba(168,85,247,0.7)" text-anchor="middle">Because my world feels brighter with you</text>
  <!-- YES button -->
  <rect x="185" y="306" width="120" height="36" rx="18"
    fill="url(#heart4)" filter="drop-shadow(0 4px 12px rgba(255,77,125,0.4))"/>
  <text x="245" y="330" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">YES! ♥</text>
  <!-- No button (fleeing, smaller) -->
  <rect x="370" y="315" width="64" height="28" rx="14" fill="rgba(255,255,255,0.65)" stroke="rgba(255,133,161,0.35)" stroke-width="1.5"/>
  <text x="402" y="333" font-family="sans-serif" font-size="10" fill="rgba(255,77,125,0.5)" text-anchor="middle">No...</text>
</svg>
