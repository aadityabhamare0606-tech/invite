<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f9"/>
      <stop offset="50%" stop-color="#fef2f7"/>
      <stop offset="100%" stop-color="#fde8f3"/>
    </linearGradient>
    <radialGradient id="shimmer7" cx="50%" cy="-10%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="previewGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4b6e"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <!-- Soft gradient BG -->
  <rect width="600" height="400" fill="url(#bg7)"/>
  <rect width="600" height="400" fill="url(#shimmer7)"/>
  <!-- Fleeting hearts (cursor trail feel) -->
  <g fill="rgba(255,75,110,0.16)">
    <path d="M60 70 c-6-16 10-28 20-16 c10-12 26 0 20 16 c-6 14-20 24-20 24 s-14-10-20-24z" transform="translate(-8,-4) scale(1.3)"/>
    <path d="M520 300 c-6-16 10-28 20-16 c10-12 26 0 20 16 c-6 14-20 24-20 24 s-14-10-20-24z" transform="scale(1.4)"/>
  </g>
  <g fill="rgba(244,114,182,0.20)">
    <path d="M500 90 c-6-16 10-28 20-16 c10-12 26 0 20 16 c-6 14-20 24-20 24 s-14-10-20-24z" transform="scale(1.5)"/>
    <path d="M90 260 c-6-16 10-28 20-16 c10-12 26 0 20 16 c-6 14-20 24-20 24 s-14-10-20-24z" transform="scale(1.2)"/>
  </g>
  <g fill="rgba(255,75,110,0.10)">
    <path d="M300 40 c-6-16 10-28 20-16 c10-12 26 0 20 16 c-6 14-20 24-20 24 s-14-10-20-24z" transform="scale(1.1)"/>
    <path d="M540 200 c-6-16 10-28 20-16 c10-12 26 0 20 16 c-6 14-20 24-20 24 s-14-10-20-24z" transform="scale(1.2)"/>
  </g>
  <!-- Chapter flow dots -->
  <g transform="translate(0,0)">
    <circle cx="300" cy="54" r="6" fill="#ff4b6e"/>
    <circle cx="316" cy="66" r="5" fill="rgba(255,75,110,0.55)"/>
    <circle cx="330" cy="82" r="5" fill="rgba(255,75,110,0.45)"/>
    <circle cx="340" cy="100" r="5" fill="rgba(255,75,110,0.35)"/>
    <circle cx="346" cy="120" r="5" fill="rgba(255,75,110,0.25)"/>
    <path d="M306 60 C 322 80, 336 90, 342 112" fill="none" stroke="rgba(255,75,110,0.35)" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
  <!-- Heart path (rising hearts along an S curve) -->
  <g fill="url(#previewGradient)" opacity="0.85">
    <path d="M150 330 c-6-16 10-28 20-16 c10-12 26 0 20 16 c-6 14-20 24-20 24 s-14-10-20-24z"/>
    <path d="M199 276 c-6-16 10-28 20-16 c10-12 26 0 20 16 c-6 14-20 24-20 24 s-14-10-20-24z" transform="scale(1.15) translate(-27,-40)"/>
    <path d="M265 222 c-6-16 10-28 20-16 c10-12 26 0 20 16 c-6 14-20 24-20 24 s-14-10-20-24z" transform="scale(1.3) translate(-62,-92)"/>
    <path d="M350 176 c-6-16 10-28 20-16 c10-12 26 0 20 16 c-6 14-20 24-20 24 s-14-10-20-24z" transform="scale(1.45) translate(-122,-148)"/>
  </g>
  <!-- Title -->
  <text x="300" y="245" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#880E4F"
    text-anchor="middle" filter="drop-shadow(0 2px 8px rgba(255,75,110,0.30))">7 Chapters of Our Story</text>
  <text x="300" y="268" font-family="sans-serif" font-size="12" font-weight="600" fill="rgba(136,14,79,0.75)" text-anchor="middle">Hearts follow your every move 💗</text>
  <!-- YES / NO buttons -->
  <rect x="178" y="286" width="124" height="40" rx="20" fill="url(#previewGradient)" filter="drop-shadow(0 6px 16px rgba(255,75,110,0.40))"/>
  <text x="240" y="312" font-family="sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">YES ❤️</text>
  <rect x="348" y="296" width="70" height="30" rx="15" fill="rgba(255,75,110,0.14)" stroke="rgba(255,75,110,0.5)" stroke-width="1.5"/>
  <text x="383" y="316" font-family="sans-serif" font-size="11" font-weight="700" fill="rgba(136,14,79,0.7)" text-anchor="middle">NO</text>
  <!-- Hint -->
  <text x="300" y="362" font-family="sans-serif" font-size="10" fill="rgba(136,14,79,0.45)" text-anchor="middle" font-style="italic">Tap through each chapter together 💞</text>
</svg>