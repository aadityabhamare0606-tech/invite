<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <radialGradient id="g1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d0020"/>
      <stop offset="50%" stop-color="#6b0035"/>
      <stop offset="100%" stop-color="#0a0010"/>
    </radialGradient>
    <radialGradient id="nebula1" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#880E4F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="75%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#3d0060" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <!-- Night sky background -->
  <rect width="600" height="400" fill="url(#g1)"/>
  <rect width="600" height="400" fill="url(#nebula1)"/>
  <rect width="600" height="400" fill="url(#nebula2)"/>
  <!-- Stars -->
  <g fill="#fff">
    <circle cx="45" cy="30" r="1.2" opacity="0.8"/>
    <circle cx="120" cy="18" r="0.8" opacity="0.6"/>
    <circle cx="200" cy="45" r="1.5" opacity="0.9"/>
    <circle cx="310" cy="20" r="1" opacity="0.7"/>
    <circle cx="420" cy="35" r="1.2" opacity="0.8"/>
    <circle cx="520" cy="15" r="0.9" opacity="0.6"/>
    <circle cx="560" cy="55" r="1.3" opacity="0.7"/>
    <circle cx="80" cy="80" r="0.7" opacity="0.5"/>
    <circle cx="170" cy="95" r="1" opacity="0.6"/>
    <circle cx="490" cy="70" r="0.8" opacity="0.5"/>
    <circle cx="350" cy="90" r="1.1" opacity="0.7"/>
    <circle cx="240" cy="110" r="0.6" opacity="0.4"/>
    <circle cx="150" cy="140" r="1" opacity="0.6"/>
    <circle cx="450" cy="120" r="0.7" opacity="0.5"/>
    <circle cx="540" cy="100" r="1.2" opacity="0.7"/>
  </g>
  <!-- Main question text -->
  <text x="300" y="145" font-family="Georgia, serif" font-size="52" font-weight="300" fill="#ffffff" text-anchor="middle" opacity="0.95" filter="url(#glow1)">Do you</text>
  <text x="300" y="210" font-family="Georgia, serif" font-size="64" font-weight="300" font-style="italic" fill="#E91E8C" text-anchor="middle">love</text>
  <text x="300" y="268" font-family="Georgia, serif" font-size="52" font-weight="300" fill="#ffffff" text-anchor="middle" opacity="0.95">me?</text>
  <!-- Yes button -->
  <rect x="190" y="298" width="130" height="44" rx="22" fill="#C2185B"/>
  <text x="255" y="326" font-family="sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">💕 Yes, I do</text>
  <!-- No button (fleeing) -->
  <rect x="350" y="310" width="70" height="34" rx="17" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="385" y="333" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">😟 No</text>
  <!-- Hint -->
  <text x="300" y="378" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.25)" text-anchor="middle" letter-spacing="1">Move cursor over "No" to see what happens 👀</text>
  <!-- Rose glow filter -->
  <defs>
    <filter id="glow1"><feGaussianBlur stdDeviation="2" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
</svg>
