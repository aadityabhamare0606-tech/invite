<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020c06"/>
      <stop offset="100%" stop-color="#040f08"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  </defs>
  <!-- Dark BG -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Scanline effect -->
  <rect width="600" height="400" fill="url(#scan)" opacity="0.06"/>
  <!-- Green glow -->
  <ellipse cx="300" cy="200" rx="280" ry="180" fill="rgba(0,255,136,0.04)"/>
  <!-- Terminal border -->
  <rect x="40" y="30" width="520" height="340" rx="8" fill="none" stroke="#00cc66" stroke-width="1" opacity="0.7"/>
  <!-- Title bar -->
  <rect x="40" y="30" width="520" height="32" rx="8" fill="#040f08" opacity="0.9"/>
  <rect x="40" y="46" width="520" height="16" fill="#040f08" opacity="0.9"/>
  <circle cx="62" cy="46" r="6" fill="#ff5f56"/>
  <circle cx="82" cy="46" r="6" fill="#ffbd2e"/>
  <circle cx="102" cy="46" r="6" fill="#27c93f"/>
  <text x="300" y="51" font-family="monospace" font-size="10" fill="rgba(0,255,136,0.4)" text-anchor="middle" letter-spacing="3">loveos@heart ~ terminal</text>
  <!-- Terminal lines -->
  <text x="60" y="90" font-family="monospace" font-size="11" fill="rgba(0,255,136,0.5)">▶ Booting LoveOS v2.7...</text>
  <text x="60" y="110" font-family="monospace" font-size="11" fill="rgba(0,255,136,0.6)">▶ HeartKernel v3.1.4 loaded ✓</text>
  <text x="60" y="130" font-family="monospace" font-size="11" fill="#ffcc00">⚠ feelings overflow: buffer at 94%</text>
  <text x="60" y="150" font-family="monospace" font-size="11" fill="rgba(0,255,136,0.5)">▶ Scanning for: YOU...</text>
  <text x="60" y="170" font-family="monospace" font-size="11" fill="#ff69c9">♥ User detected: You ❤️</text>
  <text x="60" y="190" font-family="monospace" font-size="11" fill="rgba(0,255,136,0.5)">▶ Loading memories... done ✓</text>
  <text x="60" y="210" font-family="monospace" font-size="11" fill="rgba(0,255,136,0.5)">▶ Build successful — 0 errors, 0 warnings</text>
  <!-- Stats mini panel -->
  <rect x="55" y="225" width="490" height="58" rx="4" fill="rgba(0,255,136,0.03)" stroke="rgba(0,100,50,0.5)" stroke-width="1"/>
  <text x="70" y="245" font-family="monospace" font-size="10" fill="rgba(0,200,100,0.6)">love.uptime</text>
  <text x="200" y="245" font-family="monospace" font-size="10" fill="#00ff88">→ 100%</text>
  <text x="340" y="245" font-family="monospace" font-size="10" fill="rgba(0,200,100,0.6)">happiness_level</text>
  <text x="475" y="245" font-family="monospace" font-size="10" fill="#00ff88">→ ∞</text>
  <text x="70" y="265" font-family="monospace" font-size="10" fill="rgba(0,200,100,0.6)">status</text>
  <text x="200" y="265" font-family="monospace" font-size="10" fill="#ff69c9">→ forever_with_you.exe</text>
  <!-- Question -->
  <text x="60" y="305" font-family="monospace" font-size="14" fill="#ff69c9" filter="url(#glow)">▶ Will you be mine? (y/n)</text>
  <!-- Buttons -->
  <rect x="60" y="320" width="160" height="30" rx="4" fill="none" stroke="#00ff88" stroke-width="1"/>
  <text x="140" y="340" font-family="monospace" font-size="12" fill="#00ff88" text-anchor="middle">[ YES ❤️ ]</text>
  <rect x="235" y="323" width="60" height="24" rx="4" fill="none" stroke="rgba(0,255,136,0.2)" stroke-width="1"/>
  <text x="265" y="339" font-family="monospace" font-size="10" fill="rgba(0,255,136,0.3)" text-anchor="middle">[ no ]</text>
</svg>
